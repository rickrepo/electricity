<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ricky's Phone</title>
  <meta name="description" content="A 2007-era iPhone rebuilt from three.js primitives. Look it over, pick it up, slide to unlock.">
  <meta property="og:title" content="Ricky's Phone">
  <meta property="og:description" content="A 2007-era iPhone rebuilt from three.js primitives. Look it over, pick it up, slide to unlock.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://rickrepo.github.io/electricity/assets/preview.jpg">
  <meta name="theme-color" content="#171412">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage" aria-label="A 3D replica of a first-generation iPhone on a stand"></div>

  <header id="hud">
    <div class="brand">
      <h1>Ricky's phone</h1>
      <p>A 2007-era iPhone, rebuilt from three.js primitives. No 3D models, no image files: every part is geometry, every surface is drawn on a canvas.</p>
    </div>
    <div class="actions">
      <button id="flip" type="button">Flip it over</button>
      <button id="pick" type="button">Pick it up</button>
    </div>
  </header>

  <p id="hint" class="hint" aria-live="polite"></p>

  <div id="fail" class="fail" hidden>
    <p>This page needs WebGL to draw the phone, and this browser has it switched off. Try a current version of Chrome, Firefox, Safari, or Edge.</p>
  </div>
  <noscript>
    <div class="fail"><p>JavaScript is required to draw the phone.</p></div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
