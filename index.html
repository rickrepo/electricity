<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ohm Zone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">

    <!-- Title Screen -->
    <div id="screen-title" class="screen active">
      <div class="title-content">
        <h1 class="game-title">OHM ZONE</h1>
        <p class="subtitle">Power up the device. Don't blow it up.</p>

        <div class="difficulty-select">
          <p class="diff-label">DIFFICULTY</p>
          <div class="diff-buttons">
            <button class="diff-btn" data-diff="easy">EASY</button>
            <button class="diff-btn selected" data-diff="medium">MEDIUM</button>
            <button class="diff-btn" data-diff="hard">HARD</button>
          </div>
        </div>

        <button id="btn-start" class="primary-btn">START</button>

        <div class="formulas">
          <h3>Remember</h3>
          <div class="formula-grid">
            <span class="formula">V = I &times; R</span>
            <span class="formula">I = V / R</span>
            <span class="formula">R = V / I</span>
            <span class="formula">P = V &times; I</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
      <div id="game-header">
        <span id="round-display">1 / 10</span>
        <span id="score-display">0</span>
        <span id="streak-display"></span>
      </div>

      <div id="timer-bar-container">
        <div id="timer-bar"></div>
      </div>

      <canvas id="circuit-canvas"></canvas>

      <div id="question-box">
        <p id="question-text"></p>
      </div>

      <div id="answers">
        <button class="answer-btn" data-idx="0"></button>
        <button class="answer-btn" data-idx="1"></button>
        <button class="answer-btn" data-idx="2"></button>
        <button class="answer-btn" data-idx="3"></button>
      </div>

      <div id="feedback-bar">
        <span id="feedback-text"></span>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="screen-gameover" class="screen">
      <div class="gameover-content">
        <h1 id="result-title">NICE WORK!</h1>
        <p id="result-detail"></p>
        <div id="result-stats"></div>
        <button id="btn-restart" class="primary-btn">PLAY AGAIN</button>
      </div>
    </div>

  </div>

  <script src="js/game.js"></script>
</body>
</html>
