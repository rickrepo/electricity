<body data-cam="loading" data-device="crt">
  <!-- 3D layers: the CSS3D layer (the monitor's DOM) sits under the WebGL canvas, which has a transparent hole where the screen is. -->
  <div id="stage">
    <div id="css3d"></div>
    <div id="webgl"></div>
    <div id="vignette"></div>
  </div>

  <!-- RickyOS. Moved onto the CRT (desktop) or the phone on the bench (mobile). -->
  <div id="os-root" class="os" aria-label="RickyOS"></div>

  <!-- Overlay for the 3D bench -->
  <div id="hud"></div>

  <!-- Breaker panel -->
  <div id="gate"></div>

  <noscript>
    <div style="position:fixed;inset:0;background:#05070b;color:#f3eee4;font-family:monospace;padding:32px;z-index:999">
      <p>RICKY'S BENCH</p>
      <p>JavaScript is required to switch the bench on.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
