  <meta name="twitter:card" content="summary_large_image">

  <link rel="modulepreload" href="vendor/three.min.js">
</head>
<body data-mode="scene" data-cam="loading">
  <!-- 3D layers: CSS3D (the monitor's DOM) sits under the WebGL canvas, which has a transparent hole where the screen is. -->
  <div id="stage">
    <div id="css3d"></div>
    <div id="webgl"></div>
    <div id="vignette"></div>
  </div>

  <!-- RickyOS. In 3D mode this element is moved onto the monitor; in 2D mode it fills the window. -->
  <div id="os-root" class="os" aria-label="RickyOS"></div>

  <!-- Overlay UI for the 3D scene -->
  <div id="hud"></div>

  <!-- BIOS boot screen -->
  <div id="boot" role="dialog" aria-label="Booting"></div>

  <noscript>
    <div style="position:fixed;inset:0;background:#000;color:#fff;font-family:monospace;padding:32px;z-index:999">
      <p>RICKY SYSTEMS BIOS</p>
      <p>JavaScript is required to boot this computer.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
