<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ricky's Phone</title>
  <meta name="description" content="A 2007-era iPhone rebuilt from three.js primitives, on a desk in a den at dusk. Pick it up, slide to unlock, open Safari.">
  <meta property="og:title" content="Ricky's Phone">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">

<body>
  <div id="stage" aria-label="A room from 2007 with a first-generation iPhone on the desk"></div>
  <div id="loading" role="status" aria-label="Loading the room">
    <div class="panel">
      <div class="head"><span>RICKY ROM  ·  DEN 2007</span><span class="mark">R</span></div>
      <div class="body">
        <div class="rows"></div>
        <div class="mini" aria-hidden="true"><i class="screen"><b>R</b></i><i class="home"></i></div>
      </div>
      <div class="bar"></div>
      <div class="tail"></div>
    </div>
  </div>

  <div id="fail" class="fail" hidden>
    <p>This page needs WebGL to draw the phone, and this browser has it switched off. Try a current version of Chrome, Firefox, Safari, or Edge.</p>
  </div>
  <noscript>
    <div class="fail"><p>JavaScript is required to draw the phone.</p></div>
  </noscript>

  <script type="module" src="js/main.js"></script>
